    <meta charset="UTF-8" />

    <script>
      (function() {
        if (typeof window !== 'undefined') {
          try {
            if (window.fetch) {
              var _realFetch = window.fetch;
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _realFetch;
                },
                set: function(fn) {
                  _realFetch = fn;
                }
              });
            }
          } catch (e) {}

          var isIgnorable = function(msg) {
            return (
              msg.indexOf('AbortError') !== -1 ||
              msg.indexOf('signal is aborted without reason') !== -1 ||
              msg.indexOf('The user aborted a request') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('@vite/client') !== -1 ||
              msg.indexOf('chrome-extension://') !== -1
            );
          };

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason ? ((event.reason.message || '') + ' ' + (event.reason.name || '') + ' ' + String(event.reason)) : '';
            if (isIgnorable(reason)) {
              event.preventDefault();
            }
          });

          window.addEventListener('error', function(event) {
            var msg = (event.message || '') + (event.error ? ' ' + (event.error.message || '') : '') + (event.filename || '');
            if (isIgnorable(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
